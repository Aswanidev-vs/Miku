plugins {
    id 'com.android.application'
}

def versionSource = rootProject.file('../../main.go')
def versionMatch = versionSource.exists()
        ? (versionSource.text =~ /const Version = "([^"]+)"/)
        : null
def appVersionName = (System.getenv('MIKU_VERSION') ?: '').trim()
if (appVersionName.isEmpty() && versionMatch != null && versionMatch.find()) {
    appVersionName = versionMatch.group(1)
}
if (appVersionName.isEmpty()) {
    appVersionName = '0.1.0'
}
appVersionName = appVersionName.replaceFirst(/^v/, '').replaceFirst(/[-+].*$/, '')

def versionParts = appVersionName.tokenize('.')
def major = versionParts.size() > 0 ? versionParts[0].toInteger() : 0
def minor = versionParts.size() > 1 ? versionParts[1].toInteger() : 0
def patch = versionParts.size() > 2 ? versionParts[2].toInteger() : 0
def calculatedVersionCode = major * 1000000 + minor * 1000 + patch
def appVersionCode = (System.getenv('MIKU_VERSION_CODE') ?: '').trim()
        .with { it.isEmpty() ? calculatedVersionCode : it.toInteger() }

def signingEnvironment = [
        'ANDROID_KEYSTORE_FILE': System.getenv('ANDROID_KEYSTORE_FILE'),
        'ANDROID_KEYSTORE_PASSWORD': System.getenv('ANDROID_KEYSTORE_PASSWORD'),
        'ANDROID_KEY_ALIAS': System.getenv('ANDROID_KEY_ALIAS'),
        'ANDROID_KEY_PASSWORD': System.getenv('ANDROID_KEY_PASSWORD')
].collectEntries { name, value -> [(name): value?.trim()] }
def hasReleaseSigning = signingEnvironment.values().every { value -> value != null && !value.isEmpty() }
def releaseSigningRequested = signingEnvironment.values().any { value -> value != null && !value.isEmpty() }
def requireReleaseSigning = ['true', '1', 'yes'].contains(
        (System.getenv('ANDROID_REQUIRE_RELEASE_SIGNING') ?: '').trim().toLowerCase()
)
def allowDebugRelease = ['true', '1', 'yes'].contains(
        (System.getenv('ANDROID_ALLOW_DEBUG_RELEASE') ?: '').trim().toLowerCase()
)
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}

if (!allowDebugRelease && (requireReleaseSigning || releaseSigningRequested) && !hasReleaseSigning) {
    throw new GradleException(
            'Release signing is incomplete. Set ANDROID_KEYSTORE_FILE, ' +
            'ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.'
    )
}
if (releaseTaskRequested && !hasReleaseSigning && !allowDebugRelease) {
    throw new GradleException(
            'Release APKs must be signed with the persistent release keystore. ' +
            'Configure the Android signing environment or explicitly set ' +
            'ANDROID_ALLOW_DEBUG_RELEASE=true for local-only testing.'
    )
}

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.wails.app"
        minSdk 21
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName

        // Physical devices are arm64-v8a. x86_64 is only needed for the Android
        // Emulator, so it's restricted to debug builds (see buildTypes) to keep
        // release/device APKs from shipping the redundant native library.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // Every distributable APK must use the same private key as previous
        // releases. The CI workflows provide this keystore from GitHub secrets.
        release {
            if (hasReleaseSigning) {
                storeFile file(signingEnvironment['ANDROID_KEYSTORE_FILE'])
                storePassword signingEnvironment['ANDROID_KEYSTORE_PASSWORD']
                keyAlias signingEnvironment['ANDROID_KEY_ALIAS']
                keyPassword signingEnvironment['ANDROID_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug signing is available only when explicitly requested for a
            // local/PR test build; distributable builds always use the release key.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
            // x86_64 kept here so the app still runs in the Android Emulator;
            // release builds drop it (inherited from defaultConfig above).
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
            // Keep Go debug symbols only for debug builds so the emulator
            // .so is debuggable; release builds are stripped (Go -w -s + NDK).
            packagingOptions {
                doNotStrip '*/arm64-v8a/libwails.so'
                doNotStrip '*/x86_64/libwails.so'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // (doNotStrip is now scoped to the debug buildType above so release
    // native libraries are stripped for smaller APKs.)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.browser:browser:1.7.0'
}
