name: Build Android APK and Windows Installer

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $innoDirectories = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "${env:ProgramFiles}\Inno Setup 6"
          )
          $innoDirectory = $innoDirectories | Where-Object { Test-Path (Join-Path $_ "ISCC.exe") } | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($innoDirectory)) {
            choco install innosetup --no-progress --yes
            $innoDirectory = $innoDirectories | Where-Object { Test-Path (Join-Path $_ "ISCC.exe") } | Select-Object -First 1
          }

          if ([string]::IsNullOrWhiteSpace($innoDirectory)) {
            throw "Inno Setup 6 was not found after installation."
          }

          Add-Content -Path $env:GITHUB_PATH -Value $innoDirectory
          Write-Host "Using Inno Setup from $innoDirectory"

      - name: Create build environment file
        shell: pwsh
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANILIST_CLIENT_ID) -or [string]::IsNullOrWhiteSpace($env:ANILIST_CLIENT_SECRET)) {
            throw "ANILIST_CLIENT_ID and ANILIST_CLIENT_SECRET GitHub secrets are required for Windows builds."
          }
          @(
            "ANILIST_CLIENT_ID=$env:ANILIST_CLIENT_ID"
            "ANILIST_CLIENT_SECRET=$env:ANILIST_CLIENT_SECRET"
          ) | Set-Content -Path .env

      - name: Install Wails CLI
        shell: pwsh
        run: |
          $env:GOFLAGS = "-tags=gtk3"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci --prefix frontend

      - name: Generate Wails bindings
        shell: pwsh
        run: wails3 generate bindings

      - name: Build Inno Setup installer
        shell: pwsh
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: wails3 task windows:package FORMAT=inno ARCH=amd64 VERSION="$env:RELEASE_VERSION"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path bin -Filter "Miku-*-windows-setup.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Inno Setup installer was not created."
          }
          Write-Host "Created $($installer.FullName)"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: miku-windows-installer
          path: bin/Miku-*-windows-setup.exe
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264

      - name: Configure stable Android signing
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is required for non-PR Android builds." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/build/android/release.keystore"
          chmod 600 "$GITHUB_WORKSPACE/build/android/release.keystore"
          test -s "$GITHUB_WORKSPACE/build/android/release.keystore"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          PKGS="pkg-config build-essential libgtk-3-dev libsoup-3.0-dev"
          CANDIDATE=$(apt-cache search --names-only '^libwebkit2gtk-.*-dev$' | awk '{print $1}' | sort -V | tail -n1 || true)

          if [ -n "$CANDIDATE" ]; then
            echo "Installing $CANDIDATE along with base packages"
            sudo apt-get install -y $PKGS "$CANDIDATE"
          else
            echo "No suitable libwebkit2gtk dev package found."
            exit 1
          fi

      - name: Install Wails CLI
        run: |
          GOFLAGS=-tags=gtk3 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Create build environment file
        run: |
          if [ -z "$ANILIST_CLIENT_ID" ] || [ -z "$ANILIST_CLIENT_SECRET" ]; then
            echo "ANILIST_CLIENT_ID and ANILIST_CLIENT_SECRET GitHub secrets are required for OAuth builds." >&2
            exit 1
          fi
          {
            printf 'ANILIST_CLIENT_ID=%s\n' "$ANILIST_CLIENT_ID"
            printf 'ANILIST_CLIENT_SECRET=%s\n' "$ANILIST_CLIENT_SECRET"
          } > .env
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          cd ..

      - name: Generate Wails bindings
        run: GOFLAGS=-tags=gtk3 wails3 generate bindings

      - name: Build Android APK
        run: wails3 task android:package:fat
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
          ANDROID_KEYSTORE_FILE: ${{ github.event_name == 'pull_request' && '' || format('{0}/build/android/release.keystore', github.workspace) }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_REQUIRE_RELEASE_SIGNING: ${{ github.event_name != 'pull_request' }}
          ANDROID_ALLOW_DEBUG_RELEASE: ${{ github.event_name == 'pull_request' }}

      - name: Find APK file
        id: find-apk
        run: |
          APK_PATH=$(find bin build/android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Get version and branch info
        id: version
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          BRANCH="${BRANCH#refs/tags/}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            IS_TAG="true"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            IS_TAG="false"
          fi

          # Versioned tags without a suffix are stable; tags with a suffix
          # (for example, -beta.1) are prereleases. GitHub does not expose
          # the source branch for a tag push in GITHUB_REF.
          if [[ "$IS_TAG" == "true" && "$VERSION" != *"-"* ]]; then
            IS_STABLE="true"
          else
            IS_STABLE="false"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
          echo "is_stable=$IS_STABLE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Branch: $BRANCH, Is Tag: $IS_TAG, Is Stable: $IS_STABLE"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: miku-${{ steps.version.outputs.version }}
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-android
      - build-windows
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: miku-${{ github.ref_name }}
          path: release-assets/android

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: miku-windows-installer
          path: release-assets/windows

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          APK_PATH=$(find release-assets/android -name "*.apk" -type f | head -1)
          WINDOWS_INSTALLER_PATH=$(find release-assets/windows -name "*.exe" -type f | head -1)

          if [[ -z "$APK_PATH" || -z "$WINDOWS_INSTALLER_PATH" ]]; then
            echo "Both the Android APK and Windows installer are required." >&2
            exit 1
          fi

          if [[ "$TAG_NAME" == *"-"* ]]; then
            APK_NAME="Miku-${TAG_NAME}.apk"
            RELEASE_TITLE="Miku ${TAG_NAME} (Beta)"
            PRERELEASE_FLAG="--prerelease"
          else
            APK_NAME="Miku-${TAG_NAME}.apk"
            RELEASE_TITLE="Miku ${TAG_NAME}"
            PRERELEASE_FLAG=""
          fi

          cp "$APK_PATH" "$(dirname "$APK_PATH")/$APK_NAME"

          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            $PRERELEASE_FLAG \
            "$(dirname "$APK_PATH")/$APK_NAME" \
            "$WINDOWS_INSTALLER_PATH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Validate Code
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update

          PKGS="pkg-config build-essential libgtk-3-dev libsoup-3.0-dev"
          CANDIDATE=$(apt-cache search --names-only '^libwebkit2gtk-.*-dev$' | awk '{print $1}' | sort -V | tail -n1 || true)

          if [ -n "$CANDIDATE" ]; then
            echo "Installing $CANDIDATE along with base packages"
            sudo apt-get install -y $PKGS "$CANDIDATE"
          else
            echo "No suitable libwebkit2gtk dev package found."
            exit 1
          fi

      - name: Install Wails CLI
        run: GOFLAGS=-tags=gtk3 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Create validation environment file
        run: |
          if [ -z "$ANILIST_CLIENT_ID" ] || [ -z "$ANILIST_CLIENT_SECRET" ]; then
            echo "ANILIST_CLIENT_ID and ANILIST_CLIENT_SECRET GitHub secrets are required for validation." >&2
            exit 1
          fi
          {
            printf 'ANILIST_CLIENT_ID=%s\n' "$ANILIST_CLIENT_ID"
            printf 'ANILIST_CLIENT_SECRET=%s\n' "$ANILIST_CLIENT_SECRET"
          } > .env
        env:
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
          ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          cd ..

      - name: Generate Wails bindings
        run: GOFLAGS=-tags=gtk3 wails3 generate bindings

      - name: Build frontend (required for go vet embed)
        run: |
          cd frontend
          npm run build
          cd ..

      - name: Validate Go code
        run: |
          go vet -tags gtk3 ./...
          echo "Go validation passed"
