name: Tag Release Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag the current application version
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create version tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'const Version = "\K[^"]+' main.go)
          if [[ -z "$VERSION" ]]; then
            echo "Could not find the application version in main.go" >&2
            exit 1
          fi

          TAG_NAME="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists; nothing to do."
            exit 0
          fi

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "Created $TAG_NAME; the tag build workflow will publish the APK and Windows installer."
