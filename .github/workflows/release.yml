name: Tag Release Version

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: tag-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag-release:
    name: Tag the current application version
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create version tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'const Version = "\K[^"]+' main.go)
          if [[ -z "$VERSION" ]]; then
            echo "Could not find the application version in main.go" >&2
            exit 1
          fi

          BASE_VERSION="${VERSION%%-*}"
          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must start with a semantic version (major.minor.patch): $VERSION" >&2
            exit 1
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ "$BRANCH" == "main" ]]; then
            if [[ "$VERSION" != "$BASE_VERSION" ]]; then
              echo "The main branch must contain a stable version without a prerelease suffix: $VERSION" >&2
              exit 1
            fi
            TAG_NAME="v$BASE_VERSION"
          else
            if [[ "$VERSION" == *"-"* ]]; then
              TAG_NAME="v$VERSION"
            else
              TAG_PREFIX="v${BASE_VERSION}-beta."
              LAST_BETA=$(git ls-remote --tags --refs origin "refs/tags/${TAG_PREFIX}*" | awk -F/ '{print $3}' | sort -V | tail -n 1)
              if [[ -z "$LAST_BETA" ]]; then
                NEXT_BETA=1
              else
                LAST_BETA_NUMBER="${LAST_BETA##*.}"
                if [[ ! "$LAST_BETA_NUMBER" =~ ^[0-9]+$ ]]; then
                  echo "Could not determine the next beta number from tag: $LAST_BETA" >&2
                  exit 1
                fi
                NEXT_BETA=$((LAST_BETA_NUMBER + 1))
              fi
              TAG_NAME="${TAG_PREFIX}${NEXT_BETA}"
            fi
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists; nothing to do."
            exit 0
          fi

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "Created $TAG_NAME from $BRANCH; the tag build workflow will publish the release assets."
